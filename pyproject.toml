[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "poptimizer/core/consts.py"
pattern = "__version__ = \"(?P<version>[0-9]+[.][0-9]+[.][0-9]+)\""

[project]
name = "poptimizer"
dynamic = ["version"]
description = "Portfolio optimization"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
    "aiohttp>=3.14.1",
    "pydantic>=2.11.1",
    "pydantic-settings[yaml]>=2.14.2",
    "uvloop>=0.22.1",
    "aiomoex>=2.2.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.2",
    "lxml>=5.3.0",
    "aiofiles>=24.1.0",
    "scipy>=1.15.0",
    "torch>=2.15.0",
    "tqdm>=4.68.2",
    "pymongo>=4.17.0",
    "reportlab>=4.4.5",
    "matplotlib>=3.11.1",
    "numpy>=2.3.3",
    "jinja2>=3.1.4",
    "keyring>=25.7.0",
    "aiosmtplib>=5.1.0",
    "email-validator>=2.3.0",
    "certifi>=2026.6.17",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.3",
    "pandas-stubs>=2.2.2.240807",
    "pytest-asyncio>=0.24.0",
    "lxml-stubs>=0.5.1",
    "scipy-stubs>=1.18.1.1",
    "types-tqdm>=4.70.0.20261106",
]

[tool.basedpyright]
include = ["poptimizer"]
pythonVersion = "3.15"
typeCheckingMode = "all"
failOnWarnings = true
# In "all" mode a bare `# type: ignore` is inert: every suppression must name its rule.
enableTypeIgnoreComments = false
# Every finding was an intentional discarded result (tg.create_task, net.train, plt.*), so the
# rule would only add `_ =` noise; reportUnusedCoroutine still catches a missing `await`.
reportUnusedCallResult = "none"
# An inferred `self.x = value` is not annotated; the enabled
# reportIncompatibleUnannotatedOverride still catches a subclass that changes its type.
reportUnannotatedClassAttribute = "none"
# Explicit @override markers are not required; reportIncompatibleMethodOverride still
# checks every real override's signature.
reportImplicitOverride = "none"

[tool.pytest.ini_options]
testpaths = ["poptimizer"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config -W error --cov=poptimizer --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 120
fix = true

[tool.ruff.lint]
select = ["ALL"]
fixable = ["ALL"]

ignore = [
    "CPY001", # Missing copyright notice at top of file
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__ - prefer doc for class
    "D203",   # One-blank-line-before-class (D203) and no-blank-line-before-class (D211) are incompatible
    "D213",   # Multi-line-summary-first-line (D212) and multi-line-summary-second-line (D213) are incompatible
    "DTZ",    # The use of `datetime` without `tzinfo` argument is not allowed - one tz zone
    "EM101",  # Exception must not use a string literal, assign to variable first - don't like many exceptions
    "EM102",  # Exception must not use an f-string literal, assign to variable first - don't like many exceptions
    "RUF001", # Ambiguous-unicode-character-string - russian
    "RUF002", # Ambiguous-unicode-character-docstring - russian
    "RUF003", # Ambiguous-unicode-character-comment - russian
    # Runtime annotation consumers (the pydantic-settings CLI and the FSM's get_type_hints)
    # need these imports at runtime; moving them under TYPE_CHECKING breaks the CLI.
    "TC001",
    "TC002",
    "TC003",
    "TRY003", # Avoid specifying long messages outside the exception class - don't like many exceptions
]

unfixable = [
    "EM101", # Exception must not use a string literal, assign to variable first
    "EM102", # Exception must not use an f-string literal, assign to variable first
]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = [
    "PLR2004", # Magic value used in comparison - expected values are the test data
    "S101",    # Use of `assert` detected - assertions are how tests assert
]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["pydantic.field_validator", "pydantic.root_validator"]
